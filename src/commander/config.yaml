# Bundled Commander defaults. A repository may replace a profile's complete
# command under `agents` in `.igniter/config.yaml`; same-named profiles inherit
# the whole command when omitted. New named candidates require a command.
# The Commander command receives the prompt through the unquoted {prompt}
# placeholder. Worker commands are launched without a prompt placeholder.
#
# Stage mapping is fixed: Build defaults to builder, Acceptance to
# acceptance, Deliver to deliverer. builder_backup and builder_expert are
# named candidates the Commander may select per run; names carry no special
# program behavior, and no automatic fallback or ordering exists.

agents:
  commander:
    command: 'opencode --prompt {prompt}'

  builder:
    command: 'opencode mini -m opencode-go/deepseekflash-4.1'

  acceptance:
    command: 'opencode mini -m openai/gpt-6-luna#max'

  deliverer:
    command: 'opencode mini -m openai/gpt-6-luna#high'

  builder_backup:
    command: 'codex -m gpt-5.6-luna'

  builder_expert:
    command: 'codex -m gpt-5.6-sol'
