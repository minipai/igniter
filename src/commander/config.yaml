# Bundled Commander defaults. Stage prompt paths are relative to this file.
# A repository may override agent fields under `agents` in `.igniter/config.yaml`.

agents:
  builder:
    harness: opencode
    model: opencode/muse-spark-1.3-contributor-free
    fallback:
      harness: codex
      model: openai/gpt-5.6-terra
  reviewer:
    harness: claude
    model: claude-sonnet-5

stages:
  build:
    prompt: stages/build.md
    agent: builder
  review:
    prompt: stages/review.md
    agent: reviewer
  deliver:
    prompt: stages/deliver.md
    agent: builder
