# Bundled Commander defaults. Stage prompt paths are relative to this file.
# A repository may override any agent profile field under `agents` in
# `.igniter/config.yaml`; omitted fields inherit the values below. A repository
# `stages` map completely replaces all three stage entries and prompt paths.
#
# Every profile — commander, builder, reviewer, deliverer, and the builder
# fallback — shares one shape: `harness`, `model`, and optional `effort`.
# `effort` is cross-harness reasoning/thinking effort. Omit it to keep the
# harness default; once set, dispatch translates it into the harness's
# native launch option (codex: `-c model_reasoning_effort="<effort>"`,
# claude: `--effort <effort>`) and refuses to launch when the harness has
# no such option, never silently dropping it.
# Codex model ids are bare (`gpt-5.6-sol`). Provider-qualified ids such as
# `openai/...` belong to OpenCode and are rejected by the Codex ChatGPT login.
#
# Stage mapping is fixed: Build runs on builder, Acceptance on reviewer,
# Deliver on deliverer. builder.fallback is the stronger Build profile the
# Commander falls back to for complex or repeatedly failing Build work.

agents:
  commander:
    harness: codex
    model: gpt-6-astra
    effort: medium

  builder:
    harness: codex
    model: gpt-5.6-terra
    fallback:
      harness: codex
      model: gpt-5.6-sol
      effort: high

  reviewer:
    harness: codex
    model: gpt-5.6-sol
    effort: high

  deliverer:
    harness: codex
    model: gpt-5.6-luna
    effort: high

stages:
  build:
    prompt: stages/build.md
    agent: builder
  review:
    prompt: stages/review.md
    agent: reviewer
  deliver:
    prompt: stages/deliver.md
    agent: deliverer
