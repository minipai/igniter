# igniter's own factory config (dogfood)
# Read by dispatch (`igniter serve` / `igniter start`). Commander run
# settings live next door; this file never carries them. `LINEAR_API_KEY`
# comes from the environment only.

project: igniter
team: Starcoder

# Parallel claim cap. When full, ready tickets wait; finishing one frees a slot.
# Paused tickets keep their workspace but do not count against the cap.
max_running: 3

# Budget per ticket in hours. A ticket running past it is flagged OVER and
# over_budget; over_budget frees the slot like paused=1 (another ticket may
# claim it) until `igniter resume` clears it. Linear state and workspace stay.
max_hours: 4

# Stuck Commander detection in minutes. A commander agent `blocked` longer
# than this gets one issue comment and stalled=1; answering the Commander
# clears it back to null. Linear state and workspace stay.
blocked_minutes: 20

# Web/API bind address. Never 0.0.0.0; the factory host uses its Tailscale IP.
# `--port` / `IGNITER_PORT` still override the port portion.
listen: 127.0.0.1:3457

# Linear state display names: igniter's vocabulary on the left, whatever
# this Linear workspace calls it on the right. Dispatch validates all four
# at startup.
states:
  queued: Ready to build
  building: Building
  review: Ready to review
  # Must not equal queued, or failed tickets would be re-claimed forever.
  failed: Todo

# Optional: `herdr --remote <value> --session factory` target for README.
# herdr_remote: art@192.168.88.8

# Role to model id. Dispatch only carries the values: builder is the
# default (full tier; the free tier rate-limits mid-build), reviewer writes
# the review, escalate is the stronger model the Commander switches to for
# complex features or repeated build failures.
models:
  builder: opencode-go/muse-spark-1.3-contributor
  reviewer: claude-sonnet-5
  escalate: openai/gpt-5.6-terra
