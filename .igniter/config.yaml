# igniter's own factory config (dogfood)
# Read by dispatch (`igniter serve` / `igniter start`). Commander run
# settings live next door; this file never carries them. `LINEAR_API_KEY`
# comes from the environment only.

project: igniter
team: Starcoder

# Parallel claim cap. When full, ready tickets wait; finishing one frees a slot.
# Blocked tickets keep their workspace but do not count against the cap.
max_running: 3

# Web/API bind address. Never 0.0.0.0; the factory host uses its Tailscale IP.
# `--port` / `IGNITER_PORT` still override the port portion.
listen: 127.0.0.1:3457

# Delivery document: the project-settings file the Commander reads at the
# start of a run (path relative to the repo root). When set, the Commander
# reads this file directly; when absent, it searches the repo for the
# document and writes the found path back here.
delivery: docs/delivery.md

# Linear status display names: igniter's vocabulary on the left, whatever
# this Linear workspace calls it on the right. Dispatch validates all six
# at startup, including their workflow types (backlog, unstarted, three
# started, completed).
states:
  backlog: Backlog
  todo: Todo
  build: Build
  review: Review
  deliver: Deliver
  done: Done

# Progress label group: the group name plus its four labels, shared across
# all stages. Dispatch validates the group and every label's membership at
# startup. Todo, Build, Review, and Deliver carry exactly one; Backlog and
# Done carry none.
progress:
  group: Progress
  pending: Pending
  in_progress: In progress
  complete: Complete
  blocked: Blocked

# Optional: `herdr --remote <value> --session factory` target for README.
# herdr_remote: art@192.168.88.8

# Role to model id. Dispatch only carries the values: builder is the
# default (full tier; the free tier rate-limits mid-build), reviewer writes
# the review, escalate is the stronger model the Commander switches to for
# complex features or repeated build failures.
models:
  builder: opencode-go/muse-spark-1.3-contributor
  reviewer: claude-sonnet-5
  escalate: openai/gpt-5.6-terra
