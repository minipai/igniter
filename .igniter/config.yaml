# igniter's own factory config (dogfood)
# Read by Igniter commands. `LINEAR_API_KEY`
# comes from the environment only.
#
# The lifecycle and Progress vocabulary are Igniter protocol constants:
# Backlog → Todo → Build → Acceptance → Deliver → Done, with Progress
# Pending | In progress | Complete | Blocked. Stage prompts are bundled and
# cannot be replaced; `runbooks` adds optional project-specific instructions.

project: igniter
team: Starcoder

# Parallel claim cap. When full, ready tickets wait; finishing one frees a slot.
# Blocked tickets keep their workspace but do not count against the cap.
max_running: 3

# Branch a delivery lands on.
target_branch: main

# Optional: `herdr --remote <value> --session factory` target for README.
# herdr_remote: art@192.168.88.8

# Agent overrides may set any profile field (commander, builder,
# acceptance, deliverer, or any named candidate: harness, model, effort).
# A same-named profile merges field by field over the bundled default;
# a new name must be a complete harness + model profile. Stage defaults are
# fixed: Build → builder, Acceptance → acceptance, Deliver → deliverer.
# The Commander may select another named candidate per stage, e.g.
# `igniter worker start <ticket> --agent builder_expert`.
agents:
  builder:
    harness: opencode
    model: opencode-go/deepseek-v4.1-flash
    # DeepSeek V4 Flash defaults to high, its recommended effort for daily
    # agent work. OpenCode's interactive TUI has no --variant launch option.

  acceptance:
    harness: claude
    model: claude-sonnet-5
    effort: high

# Optional project runbooks. Each entry is optional; omit the whole map to
# use only the bundled stage protocol prompts and repository instructions.
# Paths are repo-relative, must exist and be non-empty, and may not escape
# the repository through `..` or a symlink.
runbooks:
  build: .igniter/workflow/build.md
  acceptance: .igniter/workflow/acceptance.md
  deliver: .igniter/workflow/deliver.md
