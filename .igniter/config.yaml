# igniter's own factory config (dogfood)
# Read by Igniter commands. `LINEAR_API_KEY`
# comes from the environment only.

project: igniter
team: Starcoder

# Parallel claim cap. When full, ready tickets wait; finishing one frees a slot.
# Blocked tickets keep their workspace but do not count against the cap.
max_running: 3

# Project workflow. Supplying `stages` replaces all three bundled prompts;
# every prompt path is relative to the repository root.
stages:
  build:
    prompt: .igniter/workflow/build.md
    agent: builder
  review:
    prompt: .igniter/workflow/review.md
    agent: reviewer
  deliver:
    prompt: .igniter/workflow/deliver.md
    agent: deliverer

# Linear status display names: igniter's vocabulary on the left, whatever
# this Linear workspace calls it on the right. Dispatch validates all six
# at startup, including their workflow types (backlog, unstarted, three
# started, completed).
states:
  backlog: Backlog
  todo: Todo
  build: Build
  review: Review
  deliver: Deliver
  done: Done

# Progress label group: the group name plus its four labels, shared across
# all stages. Dispatch validates the group and every label's membership at
# startup. Todo, Build, Review, and Deliver carry exactly one; Backlog and
# Done carry none.
progress:
  group: Progress
  pending: Pending
  in_progress: In progress
  complete: Complete
  blocked: Blocked

# Optional: `herdr --remote <value> --session factory` target for README.
# herdr_remote: art@192.168.88.8

# Agent overrides may set any profile field (commander, builder,
# builder.fallback, reviewer, deliverer: harness, model, effort).
# Omitted profiles inherit src/commander/config.yaml.
agents:
  builder:
    harness: opencode
    model: opencode-go/deepseek-v4-flash
    # DeepSeek V4 Flash defaults to high, its recommended effort for daily
    # agent work. OpenCode's interactive TUI has no --variant launch option.

  reviewer:
    harness: claude
    model: claude-sonnet-5
