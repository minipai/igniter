name: Auto Merge

on:
  workflow_run:
    workflows: [Check]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  deliver:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate the checked pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="$(jq -r '.workflow_run.pull_requests | if length == 1 then .[0].number else empty end' "$GITHUB_EVENT_PATH")"
          test -n "$pr_number"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" > "$RUNNER_TEMP/pr-before.json"
          head_sha="$(jq -r '.head.sha' "$RUNNER_TEMP/pr-before.json")"
          head_ref="$(jq -r '.head.ref' "$RUNNER_TEMP/pr-before.json")"
          head_repo="$(jq -r '.head.repo.full_name' "$RUNNER_TEMP/pr-before.json")"
          base_ref="$(jq -r '.base.ref' "$RUNNER_TEMP/pr-before.json")"
          base_sha="$(jq -r '.workflow_run.pull_requests[0].base.sha' "$GITHUB_EVENT_PATH")"
          checked_sha="$(jq -r '.workflow_run.pull_requests[0].head.sha // .workflow_run.head_sha' "$GITHUB_EVENT_PATH")"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$checked_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$head_repo" = "$GITHUB_REPOSITORY"
          test "$base_ref" = main
          [[ "$head_ref" =~ ^feature/[Ss][Tt][Aa]-[0-9]+$ ]]
          test "$head_sha" = "$checked_sha"
          printf 'number=%s\nhead_sha=%s\nbase_sha=%s\n' "$pr_number" "$head_sha" "$base_sha" >> "$GITHUB_OUTPUT"

      - name: Check out the trusted pre-merge automation
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Merge the current checked head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          if jq -e '.merged == true' "$RUNNER_TEMP/pr.json" >/dev/null; then
            echo "pull request already merged"
          else
            current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            test "$current_main" = "$BASE_SHA"
            gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
              -f merge_method=rebase \
              -f sha="$HEAD_SHA" > "$RUNNER_TEMP/merge.json"
            jq -e '.merged == true' "$RUNNER_TEMP/merge.json" >/dev/null
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr-merged.json"
          jq -e '.merged == true' "$RUNNER_TEMP/pr-merged.json" >/dev/null

      - name: Move the receipted Linear issue to Done
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: bun src/github/linear-done.ts "$RUNNER_TEMP/pr-merged.json"
