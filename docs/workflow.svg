<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="570" viewBox="0 0 1080 570" role="img" aria-labelledby="title desc">
  <title id="title">Igniter workflow</title>
  <desc id="desc">Linear ticket to Build, your Build approval, independent Acceptance, your delivery approval, Deliver, confirm landing, and Linear Done. Acceptance needing fixes returns to the same Build step. After fixes, Build returns directly to Acceptance without another Build approval.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#172536} .small{font-size:13px;fill:#64748b} .label{font-size:13px;font-weight:700;letter-spacing:2px} .name{font-size:23px;font-weight:700} .gate{font-size:15px;font-weight:600;fill:#80531c} .line{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow);stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1080" height="570" rx="20" fill="#f8fafc"/>
  <text x="48" y="49" font-size="20" font-weight="700">From ticket to delivery.</text>
  <text x="48" y="76" class="small">Commander coordinates every handoff. You approve the milestones.</text>
  <rect x="778" y="33" width="12" height="12" rx="3" fill="#eaf1ff" stroke="#bacbea"/><text x="800" y="44" class="small">Agent work</text>
  <rect x="896" y="33" width="12" height="12" rx="3" fill="#fff5e5" stroke="#e6c899"/><text x="918" y="44" class="small">Your decision</text>
  <rect x="108" y="112" width="164" height="36" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="190" y="135" text-anchor="middle" font-size="14" font-weight="600">Linear ticket</text>
  <path class="line" d="M190 148 V194"/>

  <g fill="#eaf1ff" stroke="#bacbea">
    <rect x="48" y="202" width="284" height="98" rx="12"/>
    <rect x="398" y="202" width="284" height="98" rx="12"/>
    <rect x="748" y="202" width="284" height="98" rx="12"/>
  </g>
  <text x="70" y="240" class="name">Build</text><text x="70" y="268" class="small">Implement &amp; collect evidence</text>
  <text x="420" y="240" class="name">Acceptance</text><text x="420" y="268" class="small">Independent verification</text>
  <text x="770" y="240" class="name">Deliver</text><text x="770" y="268" class="small">Repository landing procedure</text>
  <path class="line" d="M190 300 V336"/><path class="line" d="M540 300 V336"/><path class="line" d="M890 300 V336"/>
  <text x="201" y="323" class="small">First Build</text>
  <text x="551" y="323" class="small">Pass</text>
  <g fill="#fff5e5" stroke="#e6c899">
    <rect x="48" y="344" width="284" height="48" rx="10"/>
    <rect x="398" y="344" width="284" height="48" rx="10"/>
    <rect x="748" y="344" width="284" height="48" rx="10"/>
  </g>
  <text x="190" y="373" class="gate" text-anchor="middle">Your Build approval</text>
  <text x="540" y="373" class="gate" text-anchor="middle">Your delivery approval</text>
  <text x="890" y="373" class="gate" text-anchor="middle">Confirm landing</text>
  <path class="line" d="M332 368 H363 V251 H390"/>
  <path class="line" d="M682 368 H713 V251 H740"/>
  <path class="line" d="M890 392 V449"/>
  <rect x="798" y="457" width="184" height="40" rx="20" fill="#e8f4ed" stroke="#a8ceb7"/><text x="890" y="482" text-anchor="middle" font-size="15" font-weight="700" fill="#296040">Linear Done</text>
  <path class="line" d="M480 202 V170 H260 V194"/>
  <text x="370" y="158" class="small" text-anchor="middle">Needs fixes · back to Build</text>
</svg>
